services:
  - type: web
    name: agent-wind-tunnel
    runtime: docker
    plan: starter
    healthCheckPath: /api/config
    disk:
      name: wind-tunnel-quota
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: RUN_ACCESS_TOKEN
        sync: false
      - key: LIVE_INFERENCE_ENABLED
        value: "false"
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: NEBIUS_ALLOWED_MODELS
        value: nvidia/Nemotron-3_5-Lightning,nvidia/nemotron-3-super-120b-a12b
